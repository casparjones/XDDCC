<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#2d0a4e">
    <title>Arkanoid – Digital Circus</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body { overscroll-behavior: none; }
        .game-wrap {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
            width: 100%;
        }
        .game-row {
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: flex-start;
            width: 100%;
        }
        .game-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            flex: 1 1 0;
            min-width: 0;
        }
        canvas {
            background: #1a0630;
            border: 3px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 26px rgba(255, 133, 0, 0.5);
            display: block;
            width: 100%;
            max-width: 784px;
            height: auto;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .hud {
            font-size: 1.2em;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .info { text-align: center; max-width: 700px; }
        .back-link { color: #fff; text-decoration: underline; font-size: 1.1em; }
        button.restart {
            font-family: inherit;
            font-size: 1.05em;
            padding: 10px 20px;
            border: 2px solid #fff;
            border-radius: 6px;
            background: #c9184a;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
        }
        button.restart:hover, button.restart:active { background: #ff8500; }

        /* ── Scoreboard ── */
        .scoreboard {
            width: 210px;
            flex-shrink: 0;
            background: rgba(0,0,0,0.35);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            padding: 12px 14px;
        }
        .scoreboard h2 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 1.05em;
            color: #ffb703;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .sync-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #555; flex-shrink: 0; transition: background 0.3s;
        }
        .sync-dot.syncing { background: #ffb703; animation: blink 1s infinite; }
        .sync-dot.ok      { background: #4caf50; }
        .sync-dot.error   { background: #f44336; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
        .scoreboard ol {
            list-style: none; padding: 0; margin: 0; counter-reset: rank;
        }
        .scoreboard li {
            counter-increment: rank;
            display: grid;
            grid-template-columns: 1.8em 1fr auto;
            gap: 5px;
            padding: 5px 2px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
            align-items: baseline;
            font-size: 0.85em;
        }
        .scoreboard li:last-child { border-bottom: none; }
        .scoreboard li::before { content: counter(rank) "."; color: #ffb703; font-weight: bold; text-align: right; }
        .scoreboard li.new { background: rgba(255,133,0,0.25); border-radius: 4px; }
        .scoreboard .empty { text-align: center; opacity: 0.6; padding: 8px; font-size: 0.82em; }
        .scoreboard .points { font-weight: bold; color: #ffb703; }
        .scoreboard .clear {
            display: block; margin: 8px auto 0;
            background: none; border: 1px solid rgba(255,255,255,0.3);
            color: #fff; font-family: inherit; font-size: 0.78em;
            padding: 3px 8px; border-radius: 4px; cursor: pointer; opacity: 0.7;
        }
        .scoreboard .clear:hover { opacity: 1; }

        /* stack on narrow screens */
        @media (max-width: 1060px) {
            .game-row { flex-direction: column; align-items: stretch; }
            .scoreboard { width: 100%; max-width: 100%; box-sizing: border-box; }
        }
        @media (max-width: 640px) {
            body { padding: 6px 0; }
            .content { padding: 6px 4px; }
            h1 { font-size: 1.6em; margin-bottom: 4px; }
            .subtitle { font-size: 0.9em; margin-top: 0; }
            .hud { font-size: 0.95em; gap: 12px; }
            .info { font-size: 0.85em; }
            .game-wrap { gap: 8px; }
            canvas { border-radius: 4px; }
        }
        @media (orientation: landscape) and (max-height: 480px) {
            canvas { max-height: calc(100svh - 70px); }
        }

    </style>
</head>
<body>
    <div class="content">
        <header>
            <h1>🎯 Arkanoid 🎯</h1>
            <p class="subtitle">Zerstöre alle Steine, bevor der Ball dich verlässt!</p>
            <a class="back-link" href="index.html">← Zurück zur Startseite</a>
        </header>

        <div class="game-wrap">
            <div class="hud">
                <div>Punkte: <span id="score">0</span></div>
                <div>Leben: <span id="lives">3</span></div>
                <div>Level: <span id="level">1</span></div>
            </div>

            <div class="game-row">
                <div class="game-col">
                    <canvas id="game" width="784" height="448"></canvas>
                    <button class="restart" id="restart">Neu starten</button>
                </div>

                <section class="scoreboard" aria-label="Top 10 Highscores">
                    <h2>🏆 Top 10 <span class="sync-dot" id="syncDot" title="Sync-Status"></span></h2>
                    <ol id="scores"></ol>
                    <button type="button" class="clear" id="clearScores">Liste löschen</button>
                </section>
            </div>

            <p class="info">
                <strong>Desktop:</strong> ← → oder Maus · Leertaste startet.<br>
                <strong>Handy:</strong> Finger ziehen · Tippen startet den Ball.
            </p>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
